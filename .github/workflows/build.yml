name: Build All
on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        
      - name: Install MFC (自动选择路径)
        shell: pwsh
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -property installationPath
          $vsInstaller = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          Start-Process -FilePath $vsInstaller -ArgumentList "modify", "--installPath", "$installPath", "--add", "Microsoft.VisualStudio.Component.VC.ATLMFC", "--quiet", "--norestart" -Wait
          
      - name: Build All Projects
        shell: cmd
        run: |
          msbuild "${{ github.workspace }}\Server\Server.vcxproj" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:PreprocessorDefinitions="_CRT_SECURE_NO_WARNINGS" /m
          msbuild "${{ github.workspace }}\Server\TestDll.vcxproj" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:PreprocessorDefinitions="_CRT_SECURE_NO_WARNINGS" /m
          
      - name: Upload All EXE and DLL
        uses: actions/upload-artifact@v4
        with:
          name: BGW_RAT_Complete
          path: |
            Server\**\*.exe
            Server\**\*.dll
