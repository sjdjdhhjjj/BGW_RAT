name: Build
on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        
      - name: Install MFC (等待安装完成)
        shell: pwsh
        run: |
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vsWhere -latest -property installationPath
          Write-Host "安装路径: $installPath"
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $args = @('modify', '--installPath', $installPath, '--add', 'Microsoft.VisualStudio.Component.VC.ATLMFC', '--quiet', '--norestart')
          $process = Start-Process -FilePath $installer -ArgumentList $args -PassThru -Wait
          Write-Host "MFC 安装进程已退出，退出码: $($process.ExitCode)"
          
      - name: Build All Projects (完成修复)
        shell: cmd
        run: |
          msbuild "${{ github.workspace }}\Server\Server.vcxproj" /p:Configuration=Release /p:Platform=x64 /p:CharacterSet=MultiByte /p:PreprocessorDefinitions="_CRT_SECURE_NO_WARNINGS;_MBCS" /m
          msbuild "${{ github.workspace }}\Server\TestDll.vcxproj" /p:Configuration=Release /p:Platform=x64 /p:CharacterSet=MultiByte /p:PreprocessorDefinitions="_CRT_SECURE_NO_WARNINGS;_MBCS" /m
          
      - name: Upload All EXE and DLL
        uses: actions/upload-artifact@v4
        with:
          name: Complete_Version
          path: |
            Server\**\*.exe
            Server\**\*.dll
