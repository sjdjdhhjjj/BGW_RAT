name: Windows Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      run: msbuild BGW_RAT.sln /p:Configuration=Release /p:Platform=Win32
      
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: BGW_RAT_Release
        path: Release\*.exe
