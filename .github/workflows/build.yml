name: build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install MFC
        shell: cmd
        timeout-minutes: 10
        run: |
          "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" ^
            modify --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" ^
            --add Microsoft.VisualStudio.Component.VC.ATL ^
            --add Microsoft.VisualStudio.Component.VC.ATL.MFC ^
            --quiet --norestart --wait
          echo MFC 安装完成

      - name: Build All Projects
        run: msbuild YourSolution.sln /p:Configuration=Release /p:Platform=x86

      - name: Upload All EXE and DLL
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/*.exe
            **/*.dll
