name: build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install MFC
        shell: pwsh
        timeout-minutes: 15
        run: |
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          & $installer modify --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" --add Microsoft.VisualStudio.Component.VC.ATL --add Microsoft.VisualStudio.Component.VC.ATL.MFC --quiet --norestart --wait
          if ($LASTEXITCODE -eq 3010) { exit 0 }
          if ($LASTEXITCODE -ne 0) { Write-Host "MFC installer exit code: $LASTEXITCODE" }

      - name: Build All Projects
        run: msbuild BGW_RAT.sln /p:Configuration=Release /p:Platform=Win32
        # 如果解决方案名不对，改成你的 .sln 或 .vcxproj 路径，例如：
        # run: msbuild Server\TestDll.vcxproj /p:Configuration=Release /p:Platform=Win32

      - name: Upload All EXE and DLL
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/*.exe
            **/*.dll
