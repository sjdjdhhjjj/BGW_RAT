name: Windows Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution (自动选择配置)
      run: msbuild Gh0st.sln /p:Configuration=Release

    - name: Upload EXE files
      uses: actions/upload-artifact@v4
      with:
        name: BGW_RAT_Release
        path: |
          **/Release/*.exe
          **/x64/Release/*.exe
