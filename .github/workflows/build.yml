name: build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 使用成熟的社区 Action 来配置 Visual Studio 环境，它能更稳定地附带 MFC/ATL 工具集
      - name: Setup Visual Studio
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build All Projects
        run: msbuild Gh0st.sln /p:Configuration=Release

      - name: Upload All EXE and DLL
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/*.exe
            **/*.dll
